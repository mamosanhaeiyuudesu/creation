name = "ai-tools"
main = ".output/server/index.mjs"
compatibility_date = "2025-12-31"

[vars]
# Add non-secret variables here.
# Set secrets with:
#   wrangler secret put NUXT_OPENAI_API_KEY
#   wrangler secret put NUXT_ANTHROPIC_API_KEY
#   wrangler secret put NUXT_GEMINI_API_KEY  ← whisper文字起こしでGeminiを選んだ場合に使用
#   wrangler secret put NUXT_MIYAKO_VECTOR_STORE_ID
#   wrangler secret put NUXT_ENCRYPTION_KEY  ← marriage コメント暗号化キー（32文字以上推奨）
#   wrangler secret put NUXT_KIKIGAKI_GOOGLE_CLIENT_ID      ← kikigaki のGoogle連携（Docs/Sheets/Tasks/Calendar）
#   wrangler secret put NUXT_KIKIGAKI_GOOGLE_CLIENT_SECRET
# NUXT_KIKIGAKI_GOOGLE_REDIRECT_URI は秘密ではないので、この [vars] か Cloudflare ダッシュボードで設定する
#   例: https://<host>/api/kikigaki/google/callback

[[d1_databases]]
binding = "WHISPER_DB"
database_name = "whisper-db"
database_id = "a89cb679-8a17-4d46-9c90-dada3e35691b"
# 初回セットアップ:
#   wrangler d1 create whisper-db
#   wrangler d1 execute whisper-db --file src/server/db/001_auth.sql
# marriage records テーブル追加:
#   wrangler d1 execute whisper-db --file src/server/db/009_marriage.sql
# office records テーブル追加:
#   wrangler d1 execute whisper-db --remote --file src/server/db/010_office.sql
#   wrangler d1 execute whisper-db --remote --file src/server/db/011_office_day_type.sql
# game_progress テーブル追加:
#   wrangler d1 execute whisper-db --remote --file src/server/db/015_game_progress.sql
# game_records テーブル追加:
#   wrangler d1 execute whisper-db --remote --file src/server/db/016_game_records.sql

[[d1_databases]]
binding = "MLB_DB"
database_name = "mlb-db"
database_id = "7698b7b5-b0c8-4289-b19e-a99c669ca75f"
# 初回セットアップ:
#   wrangler d1 create mlb-db
#   wrangler d1 execute mlb-db --file src/server/db/mlb-schema.sql

# Cron Trigger（1日1回・UTC 7:00＝JST 16:00）
# 毎時だと mlb-sync が D1 の1日あたり書き込み行数（無料枠10万行/日）をほぼ使い切るため1日1回にした。
# mlb-sync は差分ではなく毎回シーズン全体を INSERT OR REPLACE するので、回数がそのまま書き込み量になる。
# 米国の試合は西海岸ぶんも UTC 6:00 頃までに終わるので、その後の 7:00 に前日ぶんをまとめて取り込む。
# nuxt.config.ts の nitro.scheduledTasks の式と必ず揃えること（片方だけ変えると動かない）。
[triggers]
crons = ["0 7 * * *"]

[build]
command = "npm run build"

[assets]
directory = ".output/public"

# プレビュー環境（PR自動デプロイ用）
# 本番と同じDBを参照（プレビュー用に別DBを用意する場合はIDを差し替える）
[env.preview]
name = "ai-tools-preview"

[[env.preview.d1_databases]]
binding = "WHISPER_DB"
database_name = "whisper-db"
database_id = "a89cb679-8a17-4d46-9c90-dada3e35691b"

[[env.preview.d1_databases]]
binding = "MLB_DB"
database_name = "mlb-db"
database_id = "7698b7b5-b0c8-4289-b19e-a99c669ca75f"

