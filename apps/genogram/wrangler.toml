name = "genogram"
main = ".output/server/index.mjs"
compatibility_date = "2026-03-12"

# カスタムドメイン（insightlens.jp は同一 Cloudflare アカウントの Zone である必要あり）
# デプロイ時に DNS レコードと SSL 証明書が自動作成される
routes = [
  { pattern = "genogram.insightlens.jp", custom_domain = true }
]

[vars]
# Add non-secret variables here.
# Set secrets with:
#   wrangler secret put NUXT_ANTHROPIC_API_KEY

[build]
command = "yarn build"

[assets]
directory = ".output/public"
